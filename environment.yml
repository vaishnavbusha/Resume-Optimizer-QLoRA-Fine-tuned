name: finetune
channels:
  - defaults
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - https://repo.anaconda.com/pkgs/msys2
dependencies:
  - python=3.11
  - ipykernel
  - pytorch
  - pytorch-cuda=11.8
  - torchaudio
  - torchvision
  - pip
  - pip:
    - pandas
    - numpy
    - tqdm
    - requests
    - PyPDF2
    - python-docx
    - selenium
    - webdriver-manager
    - beautifulsoup4
    - lxml
    - pywin32
    - pyarrow
    - google-genai
    - transformers>=4.44
    - datasets
    - accelerate
    - trl
    - peft
    - bitsandbytes

prefix: C:\ProgramData\anaconda3\envs\finetune
